apiVersion: v1
kind: ConfigMap
metadata:
  name: loja-config
  namespace: n3-guilherme-ana
data:
  PORT: "3000"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: loja
  DB_USER: loja
  REDIS_URL: redis://redis:6379
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credenciais
  namespace: n3-guilherme-ana
type: Opaque
stringData:
  # Valores fictícios usados no laboratório.
  mysql-password: loja-demo
  mysql-root-password: root-demo
