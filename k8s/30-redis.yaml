apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: n3-guilherme-ana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: n3-guilherme-ana
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
