apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-dados
  namespace: n3-guilherme
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: n3-guilherme
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: loja-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: loja-config
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciais
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciais
                  key: mysql-root-password
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e 'SELECT 1'
            periodSeconds: 5
            timeoutSeconds: 4
          volumeMounts:
            - name: dados
              mountPath: /var/lib/mysql
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: mysql-dados
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: n3-guilherme
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
