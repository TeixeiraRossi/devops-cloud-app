apiVersion: v1
kind: Pod
metadata:
  name: monitor-rollout
  namespace: n3-guilherme
spec:
  restartPolicy: Never
  containers:
    - name: monitor-rollout
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            if resposta=$(wget -T 2 -qO- http://api:3000/health); then
              echo "$(date +%T) $resposta"
            else
              echo "$(date +%T) FALHA HTTP"
            fi
            sleep 1
          done
